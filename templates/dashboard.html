<td>
    {% if session.role!= 'admin' %}
    <a href="/upload_work/{{ drain.id }}" class="btn btn-primary btn-sm">
        <i class="bi bi-camera"></i> Upload Work
    </a>
    {% else %}
    <form method="POST" action="/delete_drain/{{ drain.id }}" style="display:inline;"
          onsubmit="return confirm('Delete drain {{ drain.drain_id }} Ward {{ drain.ward }}? This will delete all work logs too!');">
        <button type="submit" class="btn btn-danger btn-sm">
            <i class="bi bi-trash"></i> Delete
        </button>
    </form>
    {% endif %}
</td>
